<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E86A00">
<title>El Rincón de Rincón</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700;800&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Rincón">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--verde:#0A7B34;--verde2:#12A150;--verde3:#D3F5DD;--sol:#FFC107;--naranja:#FF7A00;--naranja2:#E86A00;--durazno:#FFE2BF;--crema:#FFF1BF;--papel:#FFFFFF;--cafe:#3B2A14;--gris:#6B5A44;--linea:#F2DE9A;--rojo:#D81B1B;--rojo2:#FFE0DB;--amar2:#FFEFA8;--sombra:0 3px 10px rgba(120,70,0,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#FFD08A 0,#FFEBC2 200px,#FFF7E3 100%) fixed;color:var(--cafe);font:16px/1.4 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;min-height:100vh}
h1,h2,h3,.serif{font-family:"Bree Serif",Rockwell,"Roboto Slab",Georgia,serif;margin:0;font-weight:400}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(135deg,#E25D00 0,#FF9A1F 100%);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--verde);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.top img{height:48px;width:auto;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:18px;line-height:1.1}
.top .tt small{opacity:.85;font-size:12px}
.top .yo{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
main{max-width:920px;margin:0 auto;padding:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--naranja);box-shadow:0 -3px 10px rgba(0,0,0,.12);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:7px 1px 6px;color:var(--gris);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button{font-weight:700}.nav button span{font-size:22px;line-height:1.1}
.nav button.on{color:#fff;font-weight:800;background:linear-gradient(180deg,#FF9A1F,#E25D00)}
.card{background:var(--papel);border:2px solid var(--linea);border-top:5px solid var(--naranja);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.card h2{font-size:19px;color:var(--verde);margin-bottom:8px}
.card h3{font-size:16px;margin-bottom:6px}
.titulo{font-size:24px;color:var(--verde);text-shadow:0 1px 0 #fff;margin:4px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titulo .sp{flex:1}
.btn{background:linear-gradient(180deg,#15B55C,#0A7B34);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px)}
.btn.sol{background:linear-gradient(180deg,#FFD23F,#FF9A00);color:#3B2A14}
.btn.sec{background:#fff;color:var(--verde);border:2px solid var(--verde2);box-shadow:none}
.btn.rojo{background:linear-gradient(180deg,#F04438,#C41212)}
.btn.mini{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--gris);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:2px solid var(--linea);border-radius:10px;background:#fff;color:var(--cafe)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde2)}
textarea{min-height:60px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:2px solid #F0CF6B;background:#FFFBE6;border-radius:20px;padding:6px 12px;font-size:14px;color:var(--cafe)}
.chip.on{background:linear-gradient(180deg,#15B55C,#0A7B34);border-color:var(--verde);color:#fff}
.muted{color:var(--gris)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#FFF6CF;border:1px solid #F0D56A;border-left:7px solid var(--sol);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra)}
.kpi small{color:var(--gris);display:block;font-size:12px}
.kpi b{font-family:"Bree Serif",Georgia,serif;font-weight:400;font-size:20px}
.kpi.v{border-left-color:var(--verde2);background:#E3F9EA;border-color:#A8E6BE}.kpi.n{border-left-color:var(--naranja);background:#FFEBD2;border-color:#FFCB94}.kpi.r{border-left-color:var(--rojo);background:#FFE6E2;border-color:#FFB4AB}
.alerta{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;border:1px solid}
.alerta.precio{background:var(--rojo2);border-color:#F0B8B0}
.alerta.stock{background:var(--amar2);border-color:#E8CF7A}
.alerta.datos{background:#EEF4FF;border-color:#C5D5F2}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{background:linear-gradient(180deg,#13A852,#0A7B34);color:#fff;text-align:left;padding:7px 8px;font-size:12px;position:sticky;top:0}
.tabla td{padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla tr.sub td{background:var(--verde3);font-weight:700}
.scroll{overflow-x:auto;border-radius:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700}
.tag.ok{background:var(--verde3);color:var(--verde)}
.tag.bajo{background:var(--rojo2);color:var(--rojo)}
.tag.sin{background:var(--amar2);color:#8A6200}
.prod{background:linear-gradient(180deg,#FFFFFF,#FFF6D6);border:2px solid #F0CF6B;border-radius:14px;padding:10px 6px;text-align:center;color:var(--cafe);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.prod:active{border-color:var(--verde2);background:var(--verde3)}.prod:hover{border-color:var(--naranja)}
.prod .em{font-size:30px;line-height:1}
.prod b{font-size:13px;line-height:1.15}
.prod small{color:var(--verde);font-weight:700}
.linea{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--linea)}
.linea .nm{flex:1;min-width:0}
.linea .nm small{display:block;color:var(--gris)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid var(--verde);background:#fff;color:var(--verde);font-size:20px;line-height:1;font-weight:700}
.stepper b{min-width:28px;text-align:center}
.lista .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.lista .it .em{font-size:26px}
.lista .it .nm{flex:1;min-width:0}
.lista .it .nm small{display:block;color:var(--gris)}
.pill{background:var(--verde3);color:var(--verde);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(40,28,15,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;padding:18px 10px}
.modal.on{display:flex}
#confirm{z-index:30;align-items:center}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:16px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:6px solid var(--sol)}
.sheet.ancho{max-width:760px}
.sheet h2{color:var(--verde);font-size:20px;margin-bottom:8px;padding-right:30px}
.sheet .x{position:absolute;right:10px;top:10px;border:0;background:var(--verde3);color:var(--verde);border-radius:50%;width:32px;height:32px;font-size:16px}
.cbox{background:var(--papel);border-radius:16px;padding:18px;max-width:380px;width:100%;border-top:6px solid var(--naranja)}
.cbox p{margin:0 0 14px;font-size:17px}
.cbox .row button{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--cafe);color:#fff;padding:11px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;text-align:center;font-size:15px}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--rojo)}
.toast.ok{background:var(--verde)}
.login{max-width:460px;margin:0 auto;padding:26px 16px;min-height:100vh}.splash{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 50% 18%,#FFC23D 0,#FF8A00 45%,#E25D00 100%)}.login>*{position:relative;z-index:1}
.login .logo{display:block;margin:0 auto 6px;max-width:300px;width:78%;filter:drop-shadow(0 6px 10px rgba(80,30,0,.45))}.login .btn.ent{font-size:20px;padding:15px;background:linear-gradient(180deg,#15B55C,#0A7B34)}.login h1{color:#fff;text-shadow:0 2px 4px rgba(80,30,0,.5)}.login p.lema{color:#fff}
.login h1{text-align:center;font-size:28px}
.login p.lema{text-align:center;margin:2px 0 16px;font-weight:700}
.personas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.personas button{background:#fff;border:2px solid var(--linea);border-radius:14px;padding:14px 8px;font-weight:700;color:var(--cafe)}
.personas button.on{border-color:var(--verde);background:var(--verde3);color:var(--verde)}
.vacio{text-align:center;color:var(--gris);padding:18px 6px}
.barra{height:12px;border-radius:6px;background:var(--verde3);overflow:hidden;margin-top:3px}
.barra i{display:block;height:100%;background:var(--verde2)}
.barra.g i{background:var(--sol)}
.mes{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:6px}
.mes div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.mes i{display:block;width:100%;background:var(--verde2);border-radius:4px 4px 0 0;min-height:2px}
.mes i.g{background:var(--sol)}
.mes small{font-size:10px;color:var(--gris)}
.sep{height:1px;background:var(--linea);margin:12px 0}
.aviso{background:var(--amar2);border:1px solid #E8CF7A;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.linea.tot{border-bottom:0;background:linear-gradient(90deg,#D3F5DD,#FFF1BF);border-radius:12px;padding:10px;margin-top:6px}
.inpcaja{width:112px;text-align:right;font-weight:700;font-size:17px;padding:8px 10px;border-color:#F0CF6B;background:#FFFBE6}
.difc{min-width:56px;text-align:right;font-size:12px;font-weight:700;color:var(--verde)}
.difc.falta{color:var(--rojo)}.difc.sobra{color:#B45F00}
.aviso.big{font-size:15px;padding:12px;margin:10px 0;border-radius:12px}
.aviso.okc{background:#D3F5DD;border-color:#7ED69C}.aviso.malc{background:#FFE0DB;border-color:#FF9C90}.aviso.masc{background:#FFE9C2;border-color:#FFB84D}
.mitad{background:#FFF1BF;border:2px dashed #F0B72E;border-radius:12px;padding:8px;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mitadchip{background:#fff;border-color:#F0B72E;font-size:13px;padding:7px 10px}.mitadchip:active{background:var(--sol)}
.pill2{border:0;background:linear-gradient(180deg,#E3F9EA,#BFEFCF);color:#06592A;border-radius:14px;padding:4px 10px;font-size:13px;font-weight:700}
.pill{background:linear-gradient(180deg,#E3F9EA,#BFEFCF);color:#06592A}
.alerta.precio{border-width:2px}.login .card{border-top-color:var(--verde)}
.sub{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding:2px 0 4px}
.sub button{flex:1;white-space:nowrap;border:2px solid #FFB866;background:#FFF3E0;color:#7A3A00;border-radius:14px;padding:9px 12px;font-weight:800;font-size:14px}
.sub button.on{background:linear-gradient(180deg,#FF9A1F,#E25D00);border-color:#C95000;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:10px}
.cat{position:relative;background:linear-gradient(180deg,#FFF,#FFE9C7);border:2px solid #FFB866;border-radius:16px;padding:10px 4px;text-align:center;color:var(--cafe);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:2px}
.cat .em{font-size:32px;line-height:1.1}.cat small{font-weight:600;color:var(--gris)}
.cat.abierta{background:linear-gradient(180deg,#FFA62B,#F26A00);border-color:#C95000;color:#fff}.cat.abierta small{color:#FFF1DD}
.prod{position:relative}
.prod.sel{background:linear-gradient(180deg,#B8F0CB,#3CC96C);border-color:#0A7B34;box-shadow:0 0 0 3px rgba(10,123,52,.35)}
.prod.sel b,.prod.sel small{color:#04401B}
.badge{position:absolute;top:-8px;right:-6px;min-width:26px;height:26px;border-radius:13px;background:#D81B1B;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.badge.v{background:#0A7B34}
.pagos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.pagos .chip{border-radius:14px;padding:10px 8px;font-weight:800;text-align:center;font-size:14px}
.pagos .chip.on{background:linear-gradient(180deg,#FFA62B,#F26A00);border-color:#C95000}
.pagos .chip.fiado.on{background:linear-gradient(180deg,#F5574B,#C41212);border-color:#8F0D0D}
.pagos .chip.regalo.on{background:linear-gradient(180deg,#B26BFF,#7A2FD0);border-color:#5B1FA3}
.pagos .chip.fuera.on{background:linear-gradient(180deg,#6B7B8C,#3E4C5A);border-color:#2A3540}
.bar2{height:16px;border-radius:8px;background:#FFE2BF;overflow:hidden;margin:4px 0}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#FFB300,#FF6A00)}.bar2.vv i{background:linear-gradient(90deg,#12A150,#0A7B34)}.bar2.rr i{background:linear-gradient(90deg,#F5574B,#C41212)}
.dia{background:linear-gradient(90deg,#FF9A1F,#E25D00);color:#fff;border-radius:10px;padding:5px 10px;margin:12px 0 4px;font-weight:800;display:flex;justify-content:space-between}
.buscar{position:relative}.buscar input{padding-left:38px}.buscar:before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:6px 0}.cal b{text-align:center;font-size:11px;color:var(--gris)}
.cal button{border:1px solid #FFD39A;background:#fff;border-radius:8px;padding:4px 0 3px;min-height:46px;font-size:13px;color:var(--cafe);display:flex;flex-direction:column;align-items:center}
.cal button small{font-size:9px;color:var(--verde);font-weight:800}.cal button.hay{background:#FFF1D6;border-color:#FF9A1F}.cal button.on{background:linear-gradient(180deg,#FF9A1F,#E25D00);color:#fff;border-color:#C95000}.cal button.on small{color:#fff}.cal span{min-height:46px}
.tipo{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:800}.tipo.f{background:#FFE2BF;color:#8A3A00}.tipo.v{background:#D3F5DD;color:#06592A}.tipo.i{background:#EAD9FF;color:#5B1FA3}
@media (min-width:700px){body{padding-bottom:0}.nav{position:static;max-width:920px;margin:10px auto 0;border:3px solid var(--sol);border-radius:14px;overflow:hidden}.toast{bottom:30px}}
</style>
</head>

<div id="modal" class="modal"></div>
<div id="confirm" class="modal"></div>

function calcBalance(pref) {
  const d = S.d, c = S.c, R = d.reg, inv = d.cfg.catInversion;
  const B = { ing: 0, costo: 0, gen: 0, inv: 0, perd: 0, reg: 0, dif: 0, litros: 0, prod: {}, histIng: 0 };
  const en = function (f) { return String(f || '').indexOf(pref) === 0; };
  R.ventas.filter(function (v) { return en(v.fecha) && !v.saldoAnt; }).forEach(function (v) {
    B.ing += +v.total || 0;
    if (v.hist) B.histIng += +v.total || 0;
    const vc = c.vc[v.id] || { lineas: [], total: 0 };
    if (!v.regalo) B.costo += vc.total;
    const base = (v.lineas || []).reduce(function (s, l) { return s + l.cant * l.precio; }, 0) || 1, f = (+v.total || 0) / base;
    (v.lineas || []).forEach(function (l, i) {
      const key = l.item || ('n:' + l.nombre);
      const p = B.prod[key] || (B.prod[key] = { item: l.item, nombre: String(l.nombre || '').split(' · ')[0], u: 0, ing: 0, costo: 0, ingH: 0 });
      p.u += l.cant * (l.base || 1); p.ing += l.cant * l.precio * f; p.costo += v.regalo ? 0 : (vc.lineas[i] || 0);
      if (v.hist) p.ingH += l.cant * l.precio * f;
    });
  });
  R.gastos.filter(function (r) { return en(r.fecha); }).forEach(function (r) { if (tipoGasto(r, d) === 'inversion') B.inv += +r.valor || 0; else if (tipoGasto(r, d) === 'fijo') B.gen += +r.valor || 0; else B.gen += +r.valor || 0; });
  R.compras.filter(function (r) { return en(r.fecha) && tipoCompra(r) === 'fijo'; }).forEach(function (r) { B.gen += +r.costo || 0; });
  R.salidas.filter(function (r) { return en(r.fecha); }).forEach(function (r) { const k = c.sc[r.id] || 0; if (r.motivo === 'consumo') return; if (r.motivo === 'regalo') B.reg += k; else B.perd += k; });
  R.ventas.filter(function (v) { return en(v.fecha) && v.regalo; }).forEach(function (v) { B.reg += (c.vc[v.id] || { total: 0 }).total; });
  R.conteosInv.filter(function (r) { return en(r.fecha); }).forEach(function (r) { B.dif += c.cc[r.id] || 0; });
  R.ordeno.filter(function (r) { return en(r.fecha); }).forEach(function (r) { B.litros += +r.litros || 0; });
  B.bruta = B.ing - B.costo;
  B.otros = B.perd + B.reg + B.dif;
  B.neta = B.bruta - B.otros - B.gen;
  return B;
}

function pagoTxt(r, v) {

function mesesInforme() { return S.sub.ini || (S.sub.ini = hoy().slice(0, 7)); }
function informeMes(mes) {
  const d = S.d, R = d.reg, en = function (f) { return String(f || '').indexOf(mes) === 0; };
  const I = { ventas: 0, cabras: 0, trab: 0, lugar: 0, otrosFijos: 0, variables: 0, inversion: 0 };
  R.ventas.forEach(function (v) { if (en(v.fecha) && !v.saldoAnt) I.ventas += +v.total || 0; });
  const sumar = function (tipo, cat, v, esCompra) {
    if (tipo === 'inversion') { I.inversion += v; return; }
    if (tipo === 'variable') { I.variables += v; return; }
    if (cat === 'Alimento de animales' || cat === 'Veterinario y medicinas' || cat === 'Concentrado') I.cabras += v;
    else if (cat === 'Mano de obra') I.trab += v;
    else if (cat === 'Arriendo' || cat === 'Agua' || cat === 'Energía' || cat === 'Servicios') I.lugar += v;
    else I.otrosFijos += v;
  };
  R.gastos.forEach(function (r) { if (en(r.fecha)) sumar(tipoGasto(r, d), r.cat, +r.valor || 0); });
  R.compras.forEach(function (r) { if (en(r.fecha)) sumar(tipoCompra(r), 'Concentrado', +r.costo || 0, true); });
  I.fijos = I.cabras + I.trab + I.lugar + I.otrosFijos;
  return I;
}
function ratioVariable(mes) {
  const I = informeMes(mes);
  if (I.ventas > 0) return { r: Math.min(0.9, I.variables / I.ventas), de: 'de este mes' };
  const p = mes.split('-'); let m = +p[1], y = +p[0], vs = 0, vr = 0;
  for (let i = 0; i < 3; i++) { m--; if (m < 1) { m = 12; y--; } const J = informeMes(y + '-' + (m < 10 ? '0' : '') + m); vs += J.ventas; vr += J.variables; }
  if (vs > 0) return { r: Math.min(0.9, vr / vs), de: 'de los 3 meses anteriores' };

    return;
  }
  if (!S.quien || !e.personas.some(function (p) { return p.nombre === S.quien; })) S.quien = e.personas[0] ? e.personas[0].nombre : '';
  const pers = e.personas.find(function (p) { return p.nombre === S.quien; });
  app.innerHTML = '<div class="login"><img class="logo" src="' + LOGO + '" alt=""><h1 class="serif">El Rincón de Rincón</h1><p class="lema">La vida en el campo</p><div class="card"><label>¿Quién eres?</label><div class="personas">' +
    e.personas.map(function (p) { return '<button class="' + (p.nombre === S.quien ? 'on' : '') + '" data-act="elegir" data-n="' + h(p.nombre) + '">' + h(p.nombre) + '</button>'; }).join('') + '</div>' +
    '<label>' + (pers && pers.tipo === 'pin' ? 'Tu PIN' : 'Tu clave') + '</label><input id="lClave" type="password" inputmode="' + (pers && pers.tipo === 'pin' ? 'numeric' : 'text') + '" autocomplete="current-password">' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="lRec" style="width:auto"> Mantener la sesión abierta</label>' +
    '<button class="btn full" style="margin-top:12px" data-act="entrar">Entrar</button>' +
    (e.adminListo ? '<p class="small" style="text-align:center;margin-top:12px"><a href="#" data-act="olvide" style="color:var(--verde)">¿Olvidaste la clave de Admin?</a></p>' : '') + '</div></div>';
}
ACT.reintentar = function () { S.est = null; pintarLogin(); };
ACT.entrarlibre = async function (b) {
  b.disabled = true;
  LS.set('rincon_quien', b.dataset.n);
  try { await entrarOk('libre.' + b.dataset.n, true); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};
ACT.elegir = function (b) { S.quien = b.dataset.n; pintarLogin(); };
async function entrarOk(tok, recordar) {
  S.tok = tok;
  if (recordar) LS.set('rincon_sesion', tok);
  await cargar();
  S.vista = 'inicio'; S.est = null;
  pintar(); iniciarPoll(); asegurarBase().then(function () { if (S.d && !modalAbierto()) render(); });
}
ACT.entrar = async function (b) {
  b.disabled = true;
  try { const tok = await api('entrar', S.quien, val('lClave'), $('lRec').checked); await entrarOk(tok, $('lRec').checked); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};
ACT.crearadmin = async function (b) {
  b.disabled = true;
  try { const tok = await api('crearClave', val('lNom'), val('lClave'), $('lRec').checked, val('lMail')); await entrarOk(tok, $('lRec').checked); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};
ACT.olvide = function () {
  modal('<h2>Recuperar la clave de Admin</h2><p class="small muted">Te mandamos un código al correo del Admin.</p><label>Correo</label><input id="rcMail" type="email" inputmode="email"><button class="btn full" style="margin-top:8px" data-act="pedircodigo">Enviar código</button>' +
    '<div class="sep"></div><label>Código que llegó</label><input id="rcCod" inputmode="numeric"><label>Clave nueva (mínimo 6 caracteres)</label><input id="rcNew" type="password"><button class="btn full sol" style="margin-top:8px" data-act="restablecer">Crear clave nueva</button>' +
    '<p class="small muted" style="margin-top:10px">Si no tienes correo guardado, dime y te explico cómo sacar un código de emergencia desde Apps Script.</p>');
};
ACT.pedircodigo = async function (b) {
  b.disabled = true;
  try { toast(await api('pedirCodigoAdmin', val('rcMail')), 'ok'); } catch (e) { toast(e.message, 'err'); }
  b.disabled = false;
};
ACT.restablecer = async function (b) {
  b.disabled = true;
  try { const tok = await api('restablecerAdmin', val('rcMail'), val('rcCod'), val('rcNew'), true); cerrarModal(); await entrarOk(tok, true); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};

document.addEventListener('click', function (e) {
  if (e.target.id === 'modal') { cerrarModal(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const f = ACT[b.dataset.act];
  if (!f) return;
  e.preventDefault();
  try {
    const r = f(b, e);
    if (r && r.catch) r.catch(function (err) { toast(err.message, 'err'); });
  } catch (err) { toast(err.message, 'err'); }
});
document.addEventListener('input', function (e) {
  const t = e.target, ds = t.dataset || {};
  if (ds.s === 'bolsaN') { bolsaEst().n = t.value; return; }
  if (ds.s !== undefined) { S[ds.s] = t.value; if (ds.s === 'desc') actualizarVenta(); return; }
  if (ds.py !== undefined) { const k = ds.pyk; if (PY[k]) { PY[k].vals[ds.py] = t.value; pyTextoPintar(k); } return; }
  if (ds.cs !== undefined) { csEst()[ds.cs] = t.value; csPintar(); return; }
  if (ds.pg !== undefined) { const k = ds.pgk || 'venta'; if (PW[k]) { PW[k].vals[ds.pg] = t.value; pwTextoPintar(k); } return; }
  if (ds.vf !== undefined) { vfInicio()[ds.vf] = t.value; vfPintar(); return; }
  if (ds.lp !== undefined) { S.cart[+ds.lp].precio = pm(t.value); actualizarVenta(); return; }
  if (ds.cf !== undefined) {
    S.cf[ds.cf] = t.value;
    if (ds.cf === 'item') { S.cf.fp = ''; render(); } else { if ($('cfInfo')) $('cfInfo').innerHTML = infoCompra(); pyTextoPintar('gasto'); }
    return;
  }
  if (ds.gf !== undefined) { S.gf[ds.gf] = t.value; pyTextoPintar('gasto'); return; }
  if (ds.ch !== undefined && CH[ds.ch]) { CH[ds.ch](t); return; }
  if (ds.b !== undefined && ED) {
    const k = ds.k, v = k === 'm' ? pm(t.value) : k === 'q' ? pq(t.value) : t.value;
    setPath(ED, ds.b, v);
    if (/\.empItem$/.test(ds.b) || ds.b === 'tipo' || ds.b === 'unidad') mostrarEditor();
  }
});
document.addEventListener('change', function (e) {
  const t = e.target, ds = t.dataset || {};
  if (ds.bal !== undefined) { S.sub.bal[ds.bal] = t.value; render(); return; }
  if (ds.vf !== undefined) { vfInicio()[ds.vf] = t.value; vfPintar(); return; }
  if (ds.pysel !== undefined) { const w = PY[ds.pysel]; if (w) { if (t.id.indexOf('pya_') === 0) w.a = t.value; else w.b = t.value; } return; }
  if (ds.pwsel !== undefined) { const w = PW[ds.pwsel]; if (w) { if (t.id.indexOf('pwa_') === 0) w.a = t.value; else w.b = t.value; } }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'lClave') { const b = document.querySelector('[data-act="entrar"],[data-act="crearadmin"]'); if (b) b.click(); }
});

let pollT = null;
function iniciarPoll() {
  clearInterval(pollT);
  pollT = setInterval(refrescar, 20000);
}
async function refrescar() {
  if (!S.tok || document.hidden) return;
  try {
    const v = await call('version');
    if (v !== S.ver) {
      await cargar();
      const a = document.activeElement;
      if (!modalAbierto() && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) render();
    }
  } catch (e) { }
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });

async function boot() {
  const t = LS.get('rincon_sesion');
  if (t) {
    S.tok = t;
    try { await cargar(); pintar(); iniciarPoll(); asegurarBase().then(function () { if (S.d && !modalAbierto()) render(); }); return; }
    catch (e) { S.tok = null; S.d = null; LS.del('rincon_sesion'); }
  }
  pintar();
}
if (window.CAJA_API && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }
boot();

</script>
</body>
</html>
