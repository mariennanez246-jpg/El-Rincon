<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A7B34">
<title>El Rincón de Rincón</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Rincón">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--verde:#0A7B34;--verde2:#12A150;--verde3:#D3F5DD;--sol:#FFC107;--naranja:#FF7A00;--crema:#FFF1BF;--papel:#FFFFFF;--cafe:#3B2A14;--gris:#6B5A44;--linea:#F2DE9A;--rojo:#D81B1B;--rojo2:#FFE0DB;--amar2:#FFEFA8;--sombra:0 3px 10px rgba(120,70,0,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,#FFE79A 0,var(--crema) 220px,#FFF8DC 100%) fixed;color:var(--cafe);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;min-height:100vh}
h1,h2,h3,.serif{font-family:Rockwell,"Rockwell Nova","Roboto Slab",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(135deg,#066B2B 0,#13A852 100%);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--sol);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.top img{height:46px;width:auto;background:#fff;border-radius:10px;padding:2px 6px}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-family:Rockwell,Georgia,serif;font-size:18px;line-height:1.1}
.top .tt small{opacity:.85;font-size:12px}
.top .yo{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:20px;padding:6px 12px;font-size:13px}
main{max-width:920px;margin:0 auto;padding:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--sol);box-shadow:0 -3px 10px rgba(0,0,0,.12);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:7px 1px 6px;color:var(--gris);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button span{font-size:22px;line-height:1.1}
.nav button.on{color:#fff;font-weight:700;background:linear-gradient(180deg,#14B15A,#0A7B34)}
.card{background:var(--papel);border:2px solid var(--linea);border-top:5px solid var(--sol);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.card h2{font-size:19px;color:var(--verde);margin-bottom:8px}
.card h3{font-size:16px;margin-bottom:6px}
.titulo{font-size:24px;color:var(--verde);text-shadow:0 1px 0 #fff;margin:4px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.titulo .sp{flex:1}
.btn{background:linear-gradient(180deg,#15B55C,#0A7B34);color:#fff;border:0;border-radius:12px;padding:11px 16px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px)}
.btn.sol{background:linear-gradient(180deg,#FFD23F,#FF9A00);color:#3B2A14}
.btn.sec{background:#fff;color:var(--verde);border:2px solid var(--verde2);box-shadow:none}
.btn.rojo{background:linear-gradient(180deg,#F04438,#C41212)}
.btn.mini{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:120px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--gris);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:2px solid var(--linea);border-radius:10px;background:#fff;color:var(--cafe)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde2)}
textarea{min-height:60px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:2px solid #F0CF6B;background:#FFFBE6;border-radius:20px;padding:6px 12px;font-size:14px;color:var(--cafe)}
.chip.on{background:linear-gradient(180deg,#15B55C,#0A7B34);border-color:var(--verde);color:#fff}
.muted{color:var(--gris)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#FFF6CF;border:1px solid #F0D56A;border-left:7px solid var(--sol);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra)}
.kpi small{color:var(--gris);display:block;font-size:12px}
.kpi b{font-family:Rockwell,Georgia,serif;font-size:20px}
.kpi.v{border-left-color:var(--verde2);background:#E3F9EA;border-color:#A8E6BE}.kpi.n{border-left-color:var(--naranja);background:#FFEBD2;border-color:#FFCB94}.kpi.r{border-left-color:var(--rojo);background:#FFE6E2;border-color:#FFB4AB}
.alerta{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;border:1px solid}
.alerta.precio{background:var(--rojo2);border-color:#F0B8B0}
.alerta.stock{background:var(--amar2);border-color:#E8CF7A}
.alerta.datos{background:#EEF4FF;border-color:#C5D5F2}
.tabla{width:100%;border-collapse:collapse;font-size:14px}
.tabla th{background:linear-gradient(180deg,#13A852,#0A7B34);color:#fff;text-align:left;padding:7px 8px;font-size:12px;position:sticky;top:0}
.tabla td{padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla tr.sub td{background:var(--verde3);font-weight:700}
.scroll{overflow-x:auto;border-radius:10px}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:700}
.tag.ok{background:var(--verde3);color:var(--verde)}
.tag.bajo{background:var(--rojo2);color:var(--rojo)}
.tag.sin{background:var(--amar2);color:#8A6200}
.prod{background:linear-gradient(180deg,#FFFFFF,#FFF6D6);border:2px solid #F0CF6B;border-radius:14px;padding:10px 6px;text-align:center;color:var(--cafe);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.prod:active{border-color:var(--verde2);background:var(--verde3)}.prod:hover{border-color:var(--naranja)}
.prod .em{font-size:30px;line-height:1}
.prod b{font-size:13px;line-height:1.15}
.prod small{color:var(--verde);font-weight:700}
.linea{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--linea)}
.linea .nm{flex:1;min-width:0}
.linea .nm small{display:block;color:var(--gris)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:2px solid var(--verde);background:#fff;color:var(--verde);font-size:20px;line-height:1;font-weight:700}
.stepper b{min-width:28px;text-align:center}
.lista .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linea)}
.lista .it .em{font-size:26px}
.lista .it .nm{flex:1;min-width:0}
.lista .it .nm small{display:block;color:var(--gris)}
.pill{background:var(--verde3);color:var(--verde);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(40,28,15,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;padding:18px 10px}
.modal.on{display:flex}
#confirm{z-index:30;align-items:center}
.sheet{background:#fff;border-radius:16px;width:100%;max-width:560px;padding:16px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.35);border-top:6px solid var(--sol)}
.sheet.ancho{max-width:760px}
.sheet h2{color:var(--verde);font-size:20px;margin-bottom:8px;padding-right:30px}
.sheet .x{position:absolute;right:10px;top:10px;border:0;background:var(--verde3);color:var(--verde);border-radius:50%;width:32px;height:32px;font-size:16px}
.cbox{background:var(--papel);border-radius:16px;padding:18px;max-width:380px;width:100%;border-top:6px solid var(--naranja)}
.cbox p{margin:0 0 14px;font-size:17px}
.cbox .row button{flex:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--cafe);color:#fff;padding:11px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90%;text-align:center;font-size:15px}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--rojo)}
.toast.ok{background:var(--verde)}
.login{max-width:420px;margin:0 auto;padding:22px 16px}
.login .logo{display:block;margin:0 auto 10px;max-width:260px;width:70%}
.login h1{color:var(--verde);text-align:center;font-size:26px}
.login p.lema{text-align:center;color:var(--gris);margin:2px 0 16px}
.personas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.personas button{background:#fff;border:2px solid var(--linea);border-radius:14px;padding:14px 8px;font-weight:700;color:var(--cafe)}
.personas button.on{border-color:var(--verde);background:var(--verde3);color:var(--verde)}
.vacio{text-align:center;color:var(--gris);padding:18px 6px}
.barra{height:12px;border-radius:6px;background:var(--verde3);overflow:hidden;margin-top:3px}
.barra i{display:block;height:100%;background:var(--verde2)}
.barra.g i{background:var(--sol)}
.mes{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:6px}
.mes div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%}
.mes i{display:block;width:100%;background:var(--verde2);border-radius:4px 4px 0 0;min-height:2px}
.mes i.g{background:var(--sol)}
.mes small{font-size:10px;color:var(--gris)}
.sep{height:1px;background:var(--linea);margin:12px 0}
.aviso{background:var(--amar2);border:1px solid #E8CF7A;border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.linea.tot{border-bottom:0;background:linear-gradient(90deg,#D3F5DD,#FFF1BF);border-radius:12px;padding:10px;margin-top:6px}
.inpcaja{width:112px;text-align:right;font-weight:700;font-size:17px;padding:8px 10px;border-color:#F0CF6B;background:#FFFBE6}
.difc{min-width:56px;text-align:right;font-size:12px;font-weight:700;color:var(--verde)}
.difc.falta{color:var(--rojo)}.difc.sobra{color:#B45F00}
.aviso.big{font-size:15px;padding:12px;margin:10px 0;border-radius:12px}
.aviso.okc{background:#D3F5DD;border-color:#7ED69C}.aviso.malc{background:#FFE0DB;border-color:#FF9C90}.aviso.masc{background:#FFE9C2;border-color:#FFB84D}
.mitad{background:#FFF1BF;border:2px dashed #F0B72E;border-radius:12px;padding:8px;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mitadchip{background:#fff;border-color:#F0B72E;font-size:13px;padding:7px 10px}.mitadchip:active{background:var(--sol)}
.pill2{border:0;background:linear-gradient(180deg,#E3F9EA,#BFEFCF);color:#06592A;border-radius:14px;padding:4px 10px;font-size:13px;font-weight:700}
.pill{background:linear-gradient(180deg,#E3F9EA,#BFEFCF);color:#06592A}
.alerta.precio{border-width:2px}.login .card{border-top-color:var(--naranja)}
@media (min-width:700px){body{padding-bottom:0}.nav{position:static;max-width:920px;margin:10px auto 0;border:3px solid var(--sol);border-radius:14px;overflow:hidden}.toast{bottom:30px}}
</style>
</head>

function calcular(d) {
  const it = {};
  d.items.forEach(function (x) { it[x.id] = x; });
  const st = {};
  d.items.forEach(function (x) { const q = +x.stockIni || 0; st[x.id] = { q: q, v: q * (+x.costoRef || 0), ult: 0 }; });
  const sg = function (id) { return st[id] || (st[id] = { q: 0, v: 0, ult: 0 }); };
  const avg = function (id) { const s = sg(id); if (s.q > 0.0000001) return s.v / s.q; return s.ult || (it[id] ? +it[id].costoRef || 0 : 0); };
  const take = function (id, q) { const s = sg(id); const c = avg(id) * q; s.q -= q; s.v = s.q > 0 ? Math.max(0, s.v - c) : 0; return c; };
  const put = function (id, q, c) { const s = sg(id); if (s.q < 0) { s.q = 0; s.v = 0; } s.q += q; s.v += c; };
  let costoLeche = 0;
  if (d.cfg.lecheAuto !== false && d.cfg.itemLeche) {
    const lim = new Date(Date.now() - 60 * 86400000).toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
    const cats = d.cfg.catInversion || [];
    const fuera = cats.concat(d.cfg.catNoLeche || ['Insumos y producto comprado', 'Empaques y botellas']);
    const g = (d.reg.gastos || []).filter(function (r) { return r.fecha >= lim && fuera.indexOf(r.cat) < 0; }).reduce(function (a, r) { return a + (+r.valor || 0); }, 0);
    const l = (d.reg.ordeno || []).filter(function (r) { return r.fecha >= lim; }).reduce(function (a, r) { return a + (+r.litros || 0); }, 0);
    if (l >= 1) costoLeche = g / l;
  }
  const R = d.reg, ev = [];
  [['co', 'compras'], ['or', 'ordeno'], ['pr', 'produccion'], ['ve', 'ventas'], ['sa', 'salidas'], ['ci', 'conteosInv']].forEach(function (p) {
    (R[p[1]] || []).forEach(function (r) { ev.push({ t: p[0], r: r }); });
  });
  ev.sort(function (a, b) { return a.r.fecha < b.r.fecha ? -1 : a.r.fecha > b.r.fecha ? 1 : ((a.r.ts || 0) - (b.r.ts || 0)); });
  const vc = {}, pc = {}, sc = {}, cc = {};
  ev.forEach(function (e) {
    const r = e.r;
    if (e.t === 'co') { put(r.item, +r.cant || 0, +r.costo || 0); if (+r.cant > 0) sg(r.item).ult = (+r.costo || 0) / (+r.cant); }
    else if (e.t === 'or') {
      const lid = d.cfg.itemLeche;
      if (lid) put(lid, +r.litros || 0, (it[lid] ? +it[lid].costoRef || 0 : 0) * (+r.litros || 0));
    }
    else if (e.t === 'pr') {
      let tot = 0;
      (r.uso || []).forEach(function (u) { tot += take(u.item, +u.cant || 0); });
      const pe = (r.extras || []).reduce(function (s, x) { return s + (+x.pct || 0); }, 0);
      put(r.item, +r.cant || 0, tot * (1 - pe / 100));
      (r.extras || []).forEach(function (x) { put(x.item, +x.cant || 0, tot * (+x.pct || 0) / 100); });
      pc[r.id] = tot;
    }
    else if (e.t === 've') {
      if (r.hist) { vc[r.id] = { lineas: [], total: 0 }; return; }
      let tot = 0;
      const ls = (r.lineas || []).map(function (l) {
        let c = take(l.item, (+l.cant || 0) * (+l.base || 1));
        (l.emp || []).forEach(function (m) { c += take(m.item, (+m.cant || 0) * (+l.cant || 0)); });
        tot += c; return c;
      });
      vc[r.id] = { lineas: ls, total: tot };
    }
    else if (e.t === 'sa') { sc[r.id] = take(r.item, +r.cant || 0); }
    else if (e.t === 'ci') {
      const dif = (+r.contado || 0) - sg(r.item).q;

}

function recDef(x) {

  return costoIns(d, c, r, dep) * (1 - pe / 100) / r.rinde;

  if (!S.cart.length) return toast('Agrega productos primero.', 'err');
  const tot = totalVenta(), pag = pagadoVenta(), debe = tot - pag;
  if (debe < -0.5) return toast('Los pagos pasan el total. Revisa los valores.', 'err');
  if (debe > 0.5 && !S.cliente.trim()) return toast('Queda debiendo: escribe el nombre del cliente.', 'err');
  const bajos = S.cart.filter(function (l) {
    const x = itemPor(l.item), p = x && (x.pres || []).filter(function (q) { return q.id === l.pres; })[0];
    return p && l.precio < costoPres(S.d, S.c, x, p) && costoPres(S.d, S.c, x, p) > 0;
  });
  if (bajos.length && !(await confirmar('Estás vendiendo por debajo del costo: ' + bajos.map(function (l) { return l.nombre; }).join(', ') + '. ¿Guardar igual?', 'Guardar'))) return;
  const f = S.fecha || hoy();
  const pagos = [];
  Object.keys(PW.venta.vals).forEach(function (k) { const v = pm(PW.venta.vals[k]); if (v > 0) pagos.push({ medio: k, valor: v, fecha: f }); });
  const rec = { fecha: f, cliente: S.cliente.trim(), descuento: pm(S.desc), total: tot, pagos: pagos,
    lineas: S.cart.map(function (l) { return { item: l.item, pres: l.pres, nombre: l.nombre + (l.presNombre && l.presNombre !== 'Unidad' ? ' · ' + l.presNombre : ''), cant: l.cant, base: l.base, precio: l.precio, emp: l.emp }; }) };
  b.disabled = true;
  try {
    const falta = [];
    S.cart.forEach(function (l) { if (stockDe(l.item) < l.cant * l.base - 0.000001) falta.push(l.nombre); });
    await guardarReg('ventas', rec);
    ACT.limpiarventa();
    toast('Venta guardada ✅' + (falta.length ? ' (ojo: en inventario no alcanzaba ' + falta.join(', ') + ')' : ''), falta.length ? 'err' : 'ok');
  } catch (e) { toast(e.message, 'err'); b.disabled = false; }
};

ACT.producir = function () {
  const l = S.d.items.filter(function (x) { return x.activo !== false && (x.recetas || []).length; });
  if (!l.length) return toast('Primero crea una receta en Productos.', 'err');
  if (!S.pr || !itemPor(S.pr.item)) S.pr = { item: l[0].id, receta: null, cant: '', fecha: hoy() };
  mostrarProducir();
};
function mostrarProducir() {
  const x = itemPor(S.pr.item), rs = x.recetas || [];
  let r = rs.filter(function (q) { return q.id === S.pr.receta; })[0] || recDef(x);
  S.pr.receta = r.id;
  if (!S.pr.cant) S.pr.cant = numTxt(r.rinde);
  const cant = pq(S.pr.cant), f = r.rinde > 0 ? cant / r.rinde : 0;
  let costo = 0, falta = false;
  const filas = (r.ins || []).filter(function (i) { return +i.cant > 0; }).map(function (i) {
    const need = i.cant * f, hay = stockDe(i.item), c = costoAct(S.d, S.c, i.item) * need, u = (itemPor(i.item) || {}).unidad;
    costo += c; if (hay < need - 0.000001) falta = true;
    return '<tr><td>' + h(nombreItem(i.item)) + '</td><td class="num">' + qty(need, u) + '</td><td class="num" style="color:' + (hay < need - 0.000001 ? 'var(--rojo)' : 'inherit') + '">' + qty(hay, u) + '</td></tr>';
  }).join('');
  const extras = (r.extras || []).map(function (e) { return '<div class="aviso">También sale: <b>' + qty(e.cant * f, (itemPor(e.item) || {}).unidad) + '</b> de ' + h(nombreItem(e.item)) + '</div>'; }).join('');
  modal('<h2>🧀 Producir</h2>' +
    '<label>¿Qué vas a hacer?</label>' + itemsSel('prItem', S.pr.item, function (q) { return (q.recetas || []).length; }, 'data-ch="pr"') +
    (rs.length > 1 ? '<label>Receta</label><select id="prRec" data-ch="pr">' + opts(rs.map(function (q) { return [q.id, q.nombre]; }), r.id) + '</select>' : '') +
    '<label>¿Cuánto salió? (' + h(x.unidad) + ')</label><input id="prCant" inputmode="decimal" data-ch="pr" value="' + h(S.pr.cant) + '">' +
    '<p class="small muted">La receta rinde ' + qty(r.rinde, x.unidad) + '. Si hiciste otra cantidad, los insumos se ajustan.</p>' +
    '<div class="scroll"><table class="tabla"><tr><th>Insumo</th><th>Gasta</th><th>Hay</th></tr>' + filas + '</table></div>' + extras +
    (falta ? '<div class="aviso">⚠️ Falta algún insumo en el inventario. Puedes guardar igual, pero revisa las compras.</div>' : '') +
    '<p>Costo en insumos: <b>' + money(costo) + '</b></p>' +
    '<label>Fecha</label><input type="date" id="prFecha" value="' + h(S.pr.fecha) + '"><label>Nota</label><input id="prNota" placeholder="Opcional">' +
    '<button class="btn full" style="margin-top:12px" data-act="guardarproducir">Guardar producción</button>');
}
CH.pr = function (el) {
  if (el.id === 'prItem') { S.pr.item = el.value; S.pr.receta = null; S.pr.cant = ''; }
  else if (el.id === 'prRec') { S.pr.receta = el.value; S.pr.cant = ''; }
  else if (el.id === 'prCant') { S.pr.cant = el.value; }
  S.pr.fecha = val('prFecha') || S.pr.fecha;

  if (el.id === 'prCant') { const e = $('prCant'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }

ACT.guardarproducir = async function (b) {
  const x = itemPor(S.pr.item), r = (x.recetas || []).filter(function (q) { return q.id === S.pr.receta; })[0];
  const cant = pq(val('prCant')); if (!(cant > 0)) return toast('Escribe cuánto salió.', 'err');
  const f = cant / r.rinde;
  const rec = { fecha: val('prFecha') || hoy(), item: x.id, nombre: x.nombre, receta: r.nombre, recetaId: r.id, cant: cant, nota: val('prNota'),
    uso: (r.ins || []).filter(function (i) { return +i.cant > 0; }).map(function (i) { return { item: i.item, cant: i.cant * f }; }),
    extras: (r.extras || []).map(function (e) { return { item: e.item, cant: e.cant * f, pct: e.pct }; }) };
  b.disabled = true;
  try { await guardarReg('produccion', rec); cerrarModal(); S.pr = null; toast('Producción guardada ✅', 'ok'); render(); }
  catch (e) { toast(e.message, 'err'); b.disabled = false; }

const MOTIVOS = [['dano', 'Se dañó'], ['vencio', 'Se venció'], ['regalo', 'Regalado o donación (no se cobra)'], ['otro', 'Otro']];

ACT.contar = function () {
  const l = S.d.items.filter(function (x) { return x.activo !== false && x.tipo === (S.sub.inv || 'producto'); });
  modal('<h2>🔢 Contar el inventario</h2><p class="small muted">Escribe lo que realmente hay. Usa coma para los decimales (0,725). Deja vacío lo que no contaste.</p>' +
    '<div class="scroll"><table class="tabla"><tr><th>Producto</th><th>Sistema</th><th>Contado</th></tr>' + l.map(function (x, i) {
      return '<tr><td>' + h(x.emoji) + ' ' + h(x.nombre) + '</td><td class="num">' + qty(stockDe(x.id), x.unidad) + '</td><td><input style="width:100px" inputmode="decimal" id="ct' + i + '" data-id="' + h(x.id) + '"></td></tr>';
    }).join('') + '</table></div><label>Fecha</label><input type="date" id="ctFecha" value="' + hoy() + '"><button class="btn full" style="margin-top:12px" data-act="guardarcontar">Guardar conteo</button>', 'ancho');
};
ACT.guardarcontar = async function (b) {
  const ins = Array.prototype.slice.call(document.querySelectorAll('#modal input[data-id]')).filter(function (e) { return e.value.trim() !== ''; });
  if (!ins.length) return toast('No escribiste ningún conteo.', 'err');
  const lista = [];
  for (let k = 0; k < ins.length; k++) {
    const x = itemPor(ins[k].dataset.id), c = pq(ins[k].value), s = stockDe(x.id);
    if (Math.abs(c - s) < 0.0005) continue;
    if ((s > 0 && c > s * 5) || (s <= 0 && c > 1000)) {
      if (!(await confirmar('En ' + x.nombre + ' el sistema decía ' + qty(s, x.unidad) + ' y escribiste ' + qty(c, x.unidad) + '. ¿Es correcto? (Para decimales usa coma: 0,725)', 'Sí, es correcto'))) return;
    }
    lista.push({ fecha: val('ctFecha') || hoy(), item: x.id, nombre: x.nombre, sistema: s, contado: c });
  }
  b.disabled = true;
  try {
    for (let k = 0; k < lista.length; k++) await guardarReg('conteosInv', lista[k]);
    cerrarModal(); toast(lista.length ? 'Conteo guardado ✅ (' + lista.length + ' ajustes)' : 'Todo coincide ✅', 'ok'); render();
  } catch (e) { toast(e.message, 'err'); b.disabled = false; }
};

  const pres = d.reg.prestamos.reduce(function (a, r) { return a + pendPrestamo(r); }, 0);

  const gastos = d.reg.gastos.reduce(function (a, r) { return a + (+r.valor || 0); }, 0);
  const compras = d.reg.compras.reduce(function (a, r) { return a + (+r.costo || 0); }, 0);
  const base = d.cfg.histCargado ? 0 : d.cfg.medios.reduce(function (a, m) { return a + (+m.inicial || 0); }, 0);

function calcBalance(pref) {
  const d = S.d, c = S.c, R = d.reg, inv = d.cfg.catInversion;
  const B = { ing: 0, costo: 0, gen: 0, inv: 0, perd: 0, reg: 0, dif: 0, litros: 0, prod: {}, histIng: 0 };
  const en = function (f) { return String(f || '').indexOf(pref) === 0; };
  R.ventas.filter(function (v) { return en(v.fecha) && !v.saldoAnt; }).forEach(function (v) {
    B.ing += +v.total || 0;
    if (v.hist) B.histIng += +v.total || 0;
    const vc = c.vc[v.id] || { lineas: [], total: 0 };
    B.costo += vc.total;
    const base = (v.lineas || []).reduce(function (s, l) { return s + l.cant * l.precio; }, 0) || 1, f = (+v.total || 0) / base;
    (v.lineas || []).forEach(function (l, i) {
      const key = l.item || ('n:' + l.nombre);
      const p = B.prod[key] || (B.prod[key] = { item: l.item, nombre: String(l.nombre || '').split(' · ')[0], u: 0, ing: 0, costo: 0, ingH: 0 });
      p.u += l.cant * (l.base || 1); p.ing += l.cant * l.precio * f; p.costo += vc.lineas[i] || 0;
      if (v.hist) p.ingH += l.cant * l.precio * f;
    });
  });
  R.gastos.filter(function (r) { return en(r.fecha); }).forEach(function (r) { if (inv.indexOf(r.cat) >= 0) B.inv += +r.valor || 0; else B.gen += +r.valor || 0; });
  R.salidas.filter(function (r) { return en(r.fecha); }).forEach(function (r) { const k = c.sc[r.id] || 0; if (r.motivo === 'regalo') B.reg += k; else B.perd += k; });
  R.conteosInv.filter(function (r) { return en(r.fecha); }).forEach(function (r) { B.dif += c.cc[r.id] || 0; });
  R.ordeno.filter(function (r) { return en(r.fecha); }).forEach(function (r) { B.litros += +r.litros || 0; });
  B.bruta = B.ing - B.costo;
  B.otros = B.perd + B.reg + B.dif;
  B.neta = B.bruta - B.otros - B.gen;
  return B;
}

    '<label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="lRec" style="width:auto"> Mantener la sesión abierta</label>' +
    '<button class="btn full" style="margin-top:12px" data-act="entrar">Entrar</button>' +
    (e.adminListo ? '<p class="small" style="text-align:center;margin-top:12px"><a href="#" data-act="olvide" style="color:var(--verde)">¿Olvidaste la clave de Admin?</a></p>' : '') + '</div></div>';
}
ACT.reintentar = function () { S.est = null; pintarLogin(); };
ACT.elegir = function (b) { S.quien = b.dataset.n; pintarLogin(); };
async function entrarOk(tok, recordar) {
  S.tok = tok;
  if (recordar) LS.set('rincon_sesion', tok);
  await cargar();
  S.vista = 'inicio'; S.est = null;
  pintar(); iniciarPoll();
}
ACT.entrar = async function (b) {
  b.disabled = true;
  try { const tok = await api('entrar', S.quien, val('lClave'), $('lRec').checked); await entrarOk(tok, $('lRec').checked); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};
ACT.crearadmin = async function (b) {
  b.disabled = true;
  try { const tok = await api('crearClave', val('lNom'), val('lClave'), $('lRec').checked, val('lMail')); await entrarOk(tok, $('lRec').checked); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};
ACT.olvide = function () {
  modal('<h2>Recuperar la clave de Admin</h2><p class="small muted">Te mandamos un código al correo del Admin.</p><label>Correo</label><input id="rcMail" type="email" inputmode="email"><button class="btn full" style="margin-top:8px" data-act="pedircodigo">Enviar código</button>' +
    '<div class="sep"></div><label>Código que llegó</label><input id="rcCod" inputmode="numeric"><label>Clave nueva (mínimo 6 caracteres)</label><input id="rcNew" type="password"><button class="btn full sol" style="margin-top:8px" data-act="restablecer">Crear clave nueva</button>' +
    '<p class="small muted" style="margin-top:10px">Si no tienes correo guardado, dime y te explico cómo sacar un código de emergencia desde Apps Script.</p>');
};
ACT.pedircodigo = async function (b) {
  b.disabled = true;
  try { toast(await api('pedirCodigoAdmin', val('rcMail')), 'ok'); } catch (e) { toast(e.message, 'err'); }
  b.disabled = false;
};
ACT.restablecer = async function (b) {
  b.disabled = true;
  try { const tok = await api('restablecerAdmin', val('rcMail'), val('rcCod'), val('rcNew'), true); cerrarModal(); await entrarOk(tok, true); }
  catch (e) { toast(sinError(e.message), 'err'); b.disabled = false; }
};

document.addEventListener('click', function (e) {
  if (e.target.id === 'modal') { cerrarModal(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const f = ACT[b.dataset.act];
  if (!f) return;
  e.preventDefault();
  try {
    const r = f(b, e);
    if (r && r.catch) r.catch(function (err) { toast(err.message, 'err'); });
  } catch (err) { toast(err.message, 'err'); }
});
document.addEventListener('input', function (e) {
  const t = e.target, ds = t.dataset || {};
  if (ds.s !== undefined) { S[ds.s] = t.value; if (ds.s === 'desc') actualizarVenta(); return; }
  if (ds.pg !== undefined) { const k = ds.pgk || 'venta'; if (PW[k]) { PW[k].vals[ds.pg] = t.value; pwTextoPintar(k); } return; }
  if (ds.vf !== undefined) { vfInicio()[ds.vf] = t.value; vfPintar(); return; }
  if (ds.lp !== undefined) { S.cart[+ds.lp].precio = pm(t.value); actualizarVenta(); return; }
  if (ds.cf !== undefined) {
    S.cf[ds.cf] = t.value;
    if (ds.cf === 'item') { S.cf.fp = ''; render(); } else if ($('cfInfo')) $('cfInfo').innerHTML = infoCompra();
    return;
  }
  if (ds.gf !== undefined) { S.gf[ds.gf] = t.value; return; }
  if (ds.ch !== undefined && CH[ds.ch]) { CH[ds.ch](t); return; }
  if (ds.b !== undefined && ED) {
    const k = ds.k, v = k === 'm' ? pm(t.value) : k === 'q' ? pq(t.value) : t.value;
    setPath(ED, ds.b, v);
    if (/\.empItem$/.test(ds.b) || ds.b === 'tipo' || ds.b === 'unidad') mostrarEditor();
  }
});
document.addEventListener('change', function (e) {
  const t = e.target, ds = t.dataset || {};
  if (ds.bal !== undefined) { S.sub.bal[ds.bal] = t.value; render(); return; }
  if (ds.vf !== undefined) { vfInicio()[ds.vf] = t.value; vfPintar(); return; }
  if (ds.gmes !== undefined) { S.gm = t.value; render(); return; }
  if (ds.pwsel !== undefined) { const w = PW[ds.pwsel]; if (w) { if (t.id.indexOf('pwa_') === 0) w.a = t.value; else w.b = t.value; } }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'lClave') { const b = document.querySelector('[data-act="entrar"],[data-act="crearadmin"]'); if (b) b.click(); }
});

let pollT = null;
function iniciarPoll() {
  clearInterval(pollT);
  pollT = setInterval(refrescar, 20000);
}
async function refrescar() {
  if (!S.tok || document.hidden) return;
  try {
    const v = await call('version');
    if (v !== S.ver) {
      await cargar();
      const a = document.activeElement;
      if (!modalAbierto() && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) render();
    }
  } catch (e) { }
}
document.addEventListener('visibilitychange', function () { if (!document.hidden) refrescar(); });

async function boot() {
  const t = LS.get('rincon_sesion');
  if (t) {
    S.tok = t;
    try { await cargar(); pintar(); iniciarPoll(); return; }
    catch (e) { S.tok = null; S.d = null; LS.del('rincon_sesion'); }
  }
  pintar();
}
if (window.CAJA_API && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) { } }
boot();

</script>
</body>
</html>
